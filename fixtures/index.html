<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>supermono fixtures</title>
<style>
  :root { color-scheme: light dark; font: 13px system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; background: Canvas; color: CanvasText; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid GrayText; }
  label { display: flex; gap: 6px; align-items: center; }
  main { overflow: auto; display: flex; justify-content: center; background: color-mix(in srgb, GrayText 15%, Canvas); }
  iframe { border: 0; height: 100%; width: 100%; background: Canvas; }
  #note { color: GrayText; }
</style>
</head>
<body>
<header>
  <label>Tracker
    <select id="tracker">
      <option value="btn">BTN</option>
      <option value="ptp">PTP</option>
    </select>
  </label>
  <label>Page <select id="page"></select></label>
  <label>Theme
    <select id="theme">
      <option value="">auto (OS)</option>
      <option value="-dark">dark</option>
      <option value="-light">light</option>
    </select>
  </label>
  <label>Width
    <select id="width">
      <option value="">full</option>
      <option value="760">760 (narrow, mouse)</option>
      <option value="520">520 (phone forum/table reflow)</option>
    </select>
  </label>
  <span id="note">Touch rules (zoom: 2, 16px inputs) need DevTools device mode.</span>
</header>
<main><iframe id="frame" title="Fixture"></iframe></main>
<script>
// Captures come from scripts/scrub.mjs; scripts/dev.mjs writes captured/index.json.
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem('fx-' + k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem('fx-' + k, v); } catch {} },
};

// Captures and touch.html link /dist/<tracker>.css (touch.html relatively); swap in the chosen variant.
function applyTheme() {
  const doc = $('frame').contentDocument;
  const link = doc && doc.querySelector('link[href*="dist/"]');
  if (link) link.href = link.href.replace(/[a-z]+(-dark|-light)?\.css$/, $('tracker').value + $('theme').value + '.css');
}
function applyWidth() {
  $('frame').style.width = $('width').value ? $('width').value + 'px' : '100%';
}

let index = {};
function listPages() {
  const t = $('tracker').value;
  const pages = (index[t] ?? []).map((f) => `captured/${t}/${f}`);
  if (t === 'btn') pages.push('touch.html');
  $('page').replaceChildren(...pages.map((p) => new Option(p.replace(/^captured\/\w+\/|\.html$/g, ''), p)));
}
function restore(id) {
  const saved = store.get(id);
  if (saved && [...$(id).options].some((o) => o.value === saved)) $(id).value = saved;
}

(async () => {
  try { index = await (await fetch('captured/index.json')).json(); }
  catch { $('note').textContent = 'No captures listed: run node scripts/dev.mjs and scrub some pages.'; }
  restore('tracker');
  listPages();

  for (const id of ['tracker', 'page', 'theme', 'width']) {
    if (id !== 'tracker') restore(id);
    $(id).addEventListener('change', () => {
      store.set(id, $(id).value);
      if (id === 'tracker') { listPages(); store.set('page', $('page').value); }
      if (id === 'tracker' || id === 'page') $('frame').src = $('page').value;
      if (id === 'theme') applyTheme();
      if (id === 'width') applyWidth();
    });
  }
  $('frame').addEventListener('load', applyTheme);
  applyWidth();
  $('frame').src = $('page').value;
})();
</script>
</body>
</html>

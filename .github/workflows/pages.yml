# Publish the committed dist/ to GitHub Pages; build.sh runs locally before commit.
# Trackers load https://<account>.github.io/supermono/btn.css (or btn-dark.css / btn-light.css).
name: Pages

on:
  push:
    branches: [main]
    paths: [dist/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
